services:
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: api
    container_name: api
    command: "uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    ports: 
      - "8000:8000"
    volumes:
      - ./api:/app

volumes:
  redis_data: